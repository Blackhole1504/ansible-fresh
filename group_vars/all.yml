---
# =========================================================================
# ansible-fresh — central tunables (single source of truth)
# Override per-deployment by passing -e @your-vars.yml to ansible-pull,
# =========================================================================

# --- Release support (local.yml pre-task guard) --------------------------
supported_ubuntu_versions:
  - "24.04"
  - "26.04"

# --- Docker / reverse proxy ------------------------------------------------
# NOT managed by this playbook — a separate playbook installs and configures
# them. This baseline stays Docker-compatible: it adds no kernel rule that
# would block a later Docker install (see the sysctl note below and README
# "Docker compatibility").

# --- common role ----------------------------------------------------------
common_timezone: Europe/Paris
common_keymap: fr
# Packages installed on every server (beyond the hardening tooling itself).
common_base_packages:
  - curl
  - git
  - jq
  - ca-certificates
  - util-linux-extra  # provides hwclock, needed by community.general.timezone on 24.04+
  - qemu-guest-agent
# Services to stop, disable and mask. Remove entries you rely on.
# set common_disable_snapd: false to keep snap working.
common_disabled_services:
  - rpcbind
  - rpcbind.socket
  - cups
  - cups-browsed
common_disable_snapd: true

# --- timesync role --------------------------------------------------------
timesync_ntp_servers:
  - ntp.ubuntu.com
  - time.cloudflare.com

# --- ssh_hardening role ---------------------------------------------------
ssh_port: 22
ssh_permit_root_login: "no"          # no | prohibit-password | yes
ssh_password_authentication: "no"    # key-only auth
ssh_allow_tcp_forwarding: "no"       # set "yes" if you tunnel through ssh
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_login_grace_time: 30
ssh_max_auth_tries: 3
ssh_max_sessions: 4
# CIS-derived modern algorithm policy. Supported targets: OpenSSH 9.6
# (Ubuntu 24.04) through 10.x (26.04) — sshd rejects the WHOLE list if any
# name is unknown to it, so only names valid across that whole range belong
# here. sntrup761x25519-sha512@openssh.com (not the 9.9+ bare
# 'sntrup761x25519-sha512' alias, unknown to 9.6) and NOT mlkem768x25519-sha256
# (10.x default, unknown to 9.6).
ssh_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
# Drop-in owned by this playbook (00- wins over cloud-init's 50-).
ssh_managed_dropin: /etc/ssh/sshd_config.d/00-ansible-hardening.conf

# --- sudo_hardening role --------------------------------------------------
# Passwordless sudo is restricted to exactly one admin user, detected in
# this order (first match wins; ambiguity or absence fails the run):
#   1. sudo_admin_user override below (set it if auto-detection ever fails)
#   2. SUDO_USER fact (manual `sudo ansible-playbook/pull` runs)
#   3. /etc/sudoers.d/90-cloud-init-users single grant (first boot — where
#      Proxmox's --ciuser lands via cloud-init)
#   4. our own previous drop-in (re-runs)
#   5. `user:` key in cloud-init's cached user-data
# With a Proxmox --ciuser, cloud-init may also create the distro default
# user (ubuntu); detection then resolves the ciuser via the user-data key.
# Other users keep password-required sudo through the stock %sudo entry
# in the untouched main /etc/sudoers.
sudo_admin_user: ""
# Remove cloud-init's blanket NOPASSWD grants file (90-cloud-init-users).
sudo_remove_cloudinit_sudoers: true

# --- sysctl_hardening role ------------------------------------------------
# Applied via /etc/sysctl.d/60-ansible-hardening.conf (sysctl_settings_base
# -> template).
# NOTE: rp_filter is deliberately absent — Docker does not manage it and a
# strict value (1) breaks Docker bridge networking (relevant: a separate
# playbook installs Docker on these hosts); unset, the distro default (loose
# rp_filter=2) is docker-safe.
sysctl_settings_base:
  # Network: no routing/redirects/source-route
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  # Kernel hardening
  kernel.randomize_va_space: 2
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.unprivileged_bpf_disabled: 1
  kernel.yama.ptrace_scope: 2
  fs.suid_dumpable: 0
  fs.protected_symlinks: 1
  fs.protected_hardlinks: 1
  fs.protected_fifos: 1
  fs.protected_regular: 2
  # Network stack
  net.ipv4.tcp_syncookies: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.core.bpf_jit_harden: 2

# --- unattended_upgrades role ----------------------------------------------
unattended_automatic_reboot: false
unattended_automatic_reboot_time: "02:00"
unattended_update_interval_days: 1

# --- firewall role (UFW) ---------------------------------------------------
firewall_default_incoming: deny
firewall_default_outgoing: allow
# MUST include the SSH port or you lock yourself out.
# Web ports (80/443) for the reverse proxy are NOT opened here — the
# separate playbook that manages it owns those UFW rules.
firewall_allowed_tcp_ports: "{{ [ssh_port | string] }}"
firewall_allowed_udp_ports: []
firewall_logging: "low"

# --- fail2ban role ----------------------------------------------------------
fail2ban_ignoreip:
  - 127.0.0.1/8
  - "::1"
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_backend: systemd
# ufw banaction integrates bans with the firewall role.
fail2ban_banaction: ufw
fail2ban_sshd_enabled: true

# --- auditd role -------------------------------------------------------------
# Retention is age-based only: auditd's own size/number rotation is disabled
# (max_log_file_action=ignore, max_log_file buffer sized to never trigger)
# and a daily timer rotates the log via logrotate copytruncate, keeping
# auditd_retention_days plain-text daily files (~6 months). Deliberate
# deviation from CIS 4.1.2.3 (keep_logs) for bounded disk usage.
# Disk guards: syslog warning at 1500 MB free, halt at 1000 MB (fail-closed).
# The warning threshold MUST stay above the halt threshold to be reachable.
auditd_max_log_file_mb: 2048
auditd_max_log_file_action: ignore
auditd_space_left_mb: 1500
auditd_space_left_action: syslog
auditd_admin_space_left_mb: 1000
auditd_admin_space_left_action: halt
auditd_retention_days: 180
# Minimal CIS-derived ruleset; extend via this list.
# Deliberately excludes rule classes that generate extreme log volume
# (every open/exec by every user).
# NOTE: adding `-e 2` (immutable rules) requires a reboot to change rules
# afterwards — it is intentionally excluded so ansible-pull re-runs stay
# able to update the ruleset.
auditd_rules:
  - "-w /etc/passwd -p wa -k identity"
  - "-w /etc/group -p wa -k identity"
  - "-w /etc/shadow -p wa -k identity"
  - "-w /etc/gshadow -p wa -k identity"
  - "-w /etc/sudoers -p wa -k scope"
  - "-w /etc/sudoers.d/ -p wa -k scope"
  - "-a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change"
  - "-a always,exit -F arch=b32 -S adjtimex,settimeofday,stime -k time-change"
  - "-a always,exit -F arch=b64 -S clock_settime -k time-change"
  - "-a always,exit -F arch=b32 -S clock_settime -k time-change"
  - "-w /etc/localtime -p wa -k time-change"
  - "-w /etc/apparmor/ -p wa -k MAC-policy"
  - "-w /etc/apparmor.d/ -p wa -k MAC-policy"
  - "-w /etc/audit/auditd.conf -p wa -k auditconfig"
  - "-w /etc/audit/audit.rules -p wa -k auditconfig"
  - "-w /etc/audit/rules.d/ -p wa -k auditconfig"
  - "-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts"
  - "-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts"
  - "-a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules"
  - "-a always,exit -F arch=b32 -S init_module,finit_module,delete_module -k modules"
  - "-w /etc/ssh/sshd_config -p wa -k sshd"
  - "-w /etc/ssh/sshd_config.d/ -p wa -k sshd"
