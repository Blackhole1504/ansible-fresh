[defaults]
# ansible-pull runs as root on the fresh server; keep it self-contained.
inventory = inventory/hosts
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
localhost_warning = False
# Always emit ANSI colors: sudo/cloud-init/non-tty contexts otherwise render
# the whole run in one flat color. Logs stay readable with `less -R`.
force_color = True
