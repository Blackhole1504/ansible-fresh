---
# auditd with a minimal CIS-derived ruleset.
- name: Install auditd and plugins
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Size auditd log buffer above any realistic daily volume (max_log_file)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file\s*='
    line: "max_log_file = {{ auditd_max_log_file_mb }}"
  notify: Restart auditd

- name: Disable auditd size-based rotation (max_log_file_action)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file_action\s*='
    line: "max_log_file_action = {{ auditd_max_log_file_action }}"
  notify: Restart auditd

- name: Configure auditd low-disk warning threshold (space_left)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^space_left\s*='
    line: "space_left = {{ auditd_space_left_mb }}"
  notify: Restart auditd

- name: Configure auditd low-disk warning action (space_left_action)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^space_left_action\s*='
    line: "space_left_action = {{ auditd_space_left_action }}"
  notify: Restart auditd

- name: Configure auditd critical low-disk threshold (admin_space_left)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^admin_space_left\s*='
    line: "admin_space_left = {{ auditd_admin_space_left_mb }}"
  notify: Restart auditd

- name: Configure auditd critical low-disk behaviour (admin_space_left_action)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^admin_space_left_action\s*='
    line: "admin_space_left_action = {{ auditd_admin_space_left_action }}"
  notify: Restart auditd

- name: Deploy audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-ansible-hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules

- name: Deploy logrotate policy for the audit log
  ansible.builtin.template:
    src: ansible-audit-logrotate.j2
    dest: /etc/logrotate.d/ansible-audit
    owner: root
    group: root
    mode: "0644"
  # No handler needed: logrotate re-reads its config on every run.

- name: Deploy audit log rotation service unit
  ansible.builtin.template:
    src: ansible-auditd-archive.service.j2
    dest: /etc/systemd/system/ansible-auditd-archive.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart auditd archive timer

- name: Deploy audit log rotation timer unit
  ansible.builtin.template:
    src: ansible-auditd-archive.timer.j2
    dest: /etc/systemd/system/ansible-auditd-archive.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart auditd archive timer

- name: Enable and start audit log rotation timer
  ansible.builtin.systemd:
    name: ansible-auditd-archive.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
