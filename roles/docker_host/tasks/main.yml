---
# Optional Docker host role — runs only when docker_host_enabled is true
# (see local.yml). Ordered before sysctl_hardening so the final forwarding
# policy written by that role is docker-aware.
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy daemon.json (log rotation + live-restore)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
